name: rapidinho

services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: rapidinho-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-rapidinhoentrega.com.br}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-painel.rapidinhoentrega.com.br}
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [rapidinho]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rapidinho-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-rapidinho}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rapidinho}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [rapidinho]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: rapidinho-admin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-rapidinho}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rapidinho}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [rapidinho]

  postgres:
    image: postgres:16-alpine
    container_name: rapidinho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapidinho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-rapidinho}
      # Collation determinística: ordenação de nome de produto não pode mudar
      # conforme a versão da libc do host.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pt-BR --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/backup:/backup
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rapidinho} -d ${POSTGRES_DB:-rapidinho}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [rapidinho]

  redis:
    image: redis:7-alpine
    container_name: rapidinho-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [rapidinho]

  minio:
    image: minio/minio:latest
    container_name: rapidinho-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [rapidinho]

  # Cria o bucket e libera leitura pública das imagens. Roda uma vez e sai.
  minio-init:
    image: minio/mc:latest
    container_name: rapidinho-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-rapidinho}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}/public &&
      echo 'bucket pronto'
      "
    networks: [rapidinho]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  rapidinho:
    driver: bridge
