plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.rapidinhoentrega.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.rapidinhoentrega.app'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.3'
        // Endereço que o app abre. Para testar contra outro servidor:
        // ./gradlew assembleRelease -PsiteUrl=https://outro.endereco
        buildConfigField 'String', 'SITE_URL',
            "\"${project.findProperty('siteUrl') ?: 'https://rapidinhoentrega.com.br'}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Chave de envio da Play Store, guardada fora do repositório:
        // ./gradlew bundleRelease -PchaveDaPlay=/caminho/rapidinho-play.properties
        if (project.hasProperty('chaveDaPlay')) {
            def chave = new Properties()
            file(project.property('chaveDaPlay')).withInputStream { chave.load(it) }
            play {
                storeFile file(chave.getProperty('arquivo'))
                storePassword chave.getProperty('senha')
                keyAlias chave.getProperty('apelido')
                keyPassword chave.getProperty('senha')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sem a chave da Play, assina com a de depuração da máquina que
            // compila: é assim que sai o APK baixado do site.
            signingConfig project.hasProperty('chaveDaPlay')
                ? signingConfigs.play
                : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
