name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_ROOT: /opt/rapidinho
  SITE_NAME: rapidinho
  PRIMARY_DOMAIN: rapidinhoentrega.com.br
  WWW_DOMAIN: www.rapidinhoentrega.com.br
  ADMIN_DOMAIN: painel.rapidinhoentrega.com.br
  CANONICAL_URL: https://rapidinhoentrega.com.br
  SSL_EMAIL: admin@rapidinhoentrega.com.br
  PORT_RANGE_START: '3100'
  PORT_RANGE_END: '3199'
  SSH_OPTS: -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rapidinho
          POSTGRES_PASSWORD: rapidinho
          POSTGRES_DB: rapidinho_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rapidinho -d rapidinho_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://rapidinho:rapidinho@localhost:5432/rapidinho_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: chave-de-teste-com-mais-de-32-caracteres-aqui
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: rapidinho
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost/uploads
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3002
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://localhost:3000
      E2E_ADMIN_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rapidinho/database exec prisma migrate deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:seed
      - name: Lojas abertas 24h (o e2e não pode depender da hora do runner)
        run: pnpm db:seed:e2e
      - name: Instalar o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Subir os apps para os testes de ponta a ponta
        run: |
          pnpm --filter @rapidinho/web dev > /tmp/web.log 2>&1 &
          pnpm --filter @rapidinho/admin dev > /tmp/admin.log 2>&1 &
          for tentativa in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/ && curl -sf -o /dev/null http://localhost:3001/entrar; then
              echo "Apps no ar na tentativa $tentativa"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Os apps não subiram em 3 minutos"
          tail -50 /tmp/web.log /tmp/admin.log
          exit 1
      - run: pnpm test:e2e
      - name: Guardar o relatório quando falhar
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  # Cada imagem é um job independente, que roda em paralelo com a
  # verificação: uma falha de lint ou de formatação não atrasa nem derruba os
  # builds, e um build quebrado aparece isolado com o nome da imagem. Quem
  # segura a publicação é o `deploy`, que exige todos verdes.
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-web
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-web:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ env.CANONICAL_URL }}
            NEXT_PUBLIC_ADMIN_URL=https://${{ env.ADMIN_DOMAIN }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.CANONICAL_URL }}
            S3_PUBLIC_URL=${{ env.CANONICAL_URL }}/uploads
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-admin:
    name: Build admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-admin
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-admin:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ env.CANONICAL_URL }}
            NEXT_PUBLIC_ADMIN_URL=https://${{ env.ADMIN_DOMAIN }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.CANONICAL_URL }}
            S3_PUBLIC_URL=${{ env.CANONICAL_URL }}/uploads
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-realtime:
    name: Build realtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-realtime
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-realtime:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime

  build-worker:
    name: Build worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-worker
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-worker:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-migrate:
    name: Build migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-migrate
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-migrate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  build-nginx:
    name: Build nginx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rapidinho-nginx
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rapidinho-nginx:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  deploy:
    name: Publicar na VPS
    needs:
      [verificar, build-web, build-admin, build-realtime, build-worker, build-migrate, build-nginx]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `packages: read` deixa o GITHUB_TOKEN do job baixar as imagens que os
    # builds acabaram de publicar — sem token pessoal guardado em secret.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://rapidinhoentrega.com.br
    steps:
      - uses: actions/checkout@v4
      - name: Definir tag imutável da release
        id: release
        run: echo "version=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Conferir acesso à VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          test -n "${SSHPASS:-}" || { echo "::error::Secret VPS_PASSWORD ausente." >&2; exit 1; }
          # Até 3 tentativas: um timeout isolado entre o runner e a VPS (sem
          # nenhum registro no sshd, ou seja, antes de chegar a ela) derrubava
          # o deploy inteiro depois de 15 minutos de build.
          for tentativa in 1 2 3; do
            if sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "echo ok"; then exit 0; fi
            echo "::warning::SSH falhou na tentativa $tentativa; nova tentativa em 15s."
            sleep 15
          done
          echo "::error::A VPS não respondeu ao SSH em 3 tentativas." >&2
          exit 1
      - name: Preparar o ambiente da VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "APP_ROOT='$APP_ROOT' bash -s" < .github/scripts/preparar-vps.sh
      - name: Empacotar arquivos operacionais da release
        run: |
          tar -czf /tmp/release.tar.gz \
            docker-compose.yml docker-compose.prod.yml docker \
            .github/scripts/configurar-nginx.sh .github/scripts/aplicar-https.sh \
            .github/scripts/emitir-ssl.sh .github/scripts/preparar-env.sh \
            .github/scripts/remote-deploy.sh .github/scripts/verificar-deploy.sh \
            scripts/gerar-marca.mjs
      - name: Enviar arquivos operacionais
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_DIR="$APP_ROOT/releases/${{ steps.release.outputs.version }}"
          sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "mkdir -p '$RELEASE_DIR'"
          sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "tar -xzf - -C '$RELEASE_DIR'" < /tmp/release.tar.gz
      - name: Preparar configuração da aplicação
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE_DIR="$APP_ROOT/releases/${{ steps.release.outputs.version }}"
          sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "APP_ROOT='$APP_ROOT' GHCR_OWNER='${GITHUB_REPOSITORY_OWNER,,}' SUPER_ADMIN_PHONE='${{ secrets.SUPER_ADMIN_PHONE }}' SENTRY_DSN='${{ secrets.SENTRY_DSN }}' \
             CANONICAL_URL='$CANONICAL_URL' PRIMARY_DOMAIN='$PRIMARY_DOMAIN' ADMIN_DOMAIN='$ADMIN_DOMAIN' SSL_EMAIL='$SSL_EMAIL' \
             PORT_RANGE_START='$PORT_RANGE_START' PORT_RANGE_END='$PORT_RANGE_END' bash '$RELEASE_DIR/.github/scripts/preparar-env.sh'"
      - name: Fazer pull do GHCR e subir a release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Login com o token do próprio job, que expira quando ele termina.
          # Vai para uma pasta só desta aplicação (ver remote-deploy.sh): o
          # ~/.docker do root guarda o login GHCR de OUTROS projetos da VPS.
          GHCR_DOCKER_CONFIG="$APP_ROOT/.docker-ghcr"
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "umask 077 && mkdir -p '$GHCR_DOCKER_CONFIG' && DOCKER_CONFIG='$GHCR_DOCKER_CONFIG' docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE='${{ steps.release.outputs.version }}' RELEASE_TAG='${{ steps.release.outputs.version }}' \
             GHCR_OWNER='${GITHUB_REPOSITORY_OWNER,,}' bash -s" \
            < .github/scripts/remote-deploy.sh
      - name: Configurar Nginx HTTP
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "APP_ROOT='$APP_ROOT' SITE_NAME='$SITE_NAME' DOMAINS='$PRIMARY_DOMAIN $WWW_DOMAIN $ADMIN_DOMAIN' bash '$APP_ROOT/current/.github/scripts/configurar-nginx.sh'"
      - name: Emitir certificado SSL
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "PRIMARY_DOMAIN='$PRIMARY_DOMAIN' WWW_DOMAIN='$WWW_DOMAIN' ADMIN_DOMAIN='$ADMIN_DOMAIN' SSL_EMAIL='$SSL_EMAIL' VPS_HOST='$VPS_HOST' bash '$APP_ROOT/current/.github/scripts/emitir-ssl.sh'"
      - name: Configurar Nginx HTTPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "APP_ROOT='$APP_ROOT' SITE_NAME='$SITE_NAME' PRIMARY_DOMAIN='$PRIMARY_DOMAIN' WWW_DOMAIN='$WWW_DOMAIN' ADMIN_DOMAIN='$ADMIN_DOMAIN' bash '$APP_ROOT/current/.github/scripts/aplicar-https.sh'"
      - name: Conferir o site
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "APP_ROOT='$APP_ROOT' PRIMARY_DOMAIN='$PRIMARY_DOMAIN' ADMIN_DOMAIN='$ADMIN_DOMAIN' bash '$APP_ROOT/current/.github/scripts/verificar-deploy.sh'"
